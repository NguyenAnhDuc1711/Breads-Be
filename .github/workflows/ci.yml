name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint (non-blocking)
        continue-on-error: true
        run: npx eslint src

      - name: Type-check (non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Access-control guard matrix (blocking)
        run: npm run security:guards

      - name: Run tests (excluding tests requiring Redis/mongod)
        run: |
          EXCLUDE=(
            "src/api/controllers/post.controller.dispatch.test.ts"
            "src/api/controllers/post.controller.dispatch.enabled-false.test.ts"
            "src/api/controllers/post.controller.dispatch.direct-mode.test.ts"
            "src/api/controllers/post.controller.test.ts"
            "src/socket/controllers/message.controller.sendnext.test.ts"
            "src/api/services/feed/queue.test.ts"
            "src/api/services/feed/zset.batch.test.ts"
            "src/api/services/metrics/metrics.test.ts"
            "src/api/routers/post.route.test.ts"
          )
          FIND_ARGS=()
          for f in "${EXCLUDE[@]}"; do
            FIND_ARGS+=(-not -path "$f")
          done
          FILES=$(find src/api/services src/api/services/feed src/api/services/metrics \
            src/api/controllers src/api/middlewares src/api/validators src/api/routers \
            src/socket/controllers src/socket/services src/socket/middlewares src/socket/validators \
            -maxdepth 1 -name '*.test.ts' "${FIND_ARGS[@]}")
          npx tsx --test $FILES

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Trivy scan (non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
