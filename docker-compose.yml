services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGO_URI: mongodb://host.docker.internal:27017/Breads
      ANALYTICS_DB_URI: mongodb://host.docker.internal:27017/Breads-analytics
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # [A3] BullMQ Worker (dispatch/batch) chạy container riêng, không share process với `app`
  # (HTTP server) — scale độc lập theo queue depth bằng `docker compose up --scale worker=N`.
  worker:
    build: .
    command: ["npx", "tsx", "src/worker.ts"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://host.docker.internal:27017/Breads
      ANALYTICS_DB_URI: mongodb://host.docker.internal:27017/Breads-analytics
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://host.docker.internal:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongo-exporter:
    image: percona/mongodb_exporter:0.44
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://host.docker.internal:27017
      - --collect-all
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
      - redis-exporter
      - mongo-exporter

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Snapshots stay on this Grafana instance only — no "publish to
      # snapshot.raintank.io" (public third-party server) option in the
      # Share > Snapshot dialog.
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
